name: Site CI

on:
  pull_request:
    paths:
      - 'site/**'
      - 'chapters/**'
      - 'briefs/**'
      - 'canon/**'
      - 'editorial/**'
      - 'outputs/phase1/**'
      - 'outputs/phase2/**'
      - 'outputs/phase3/**'
      - 'research/**'
      - '.github/workflows/site-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'chapters/**'
      - 'briefs/**'
      - 'canon/**'
      - 'editorial/**'
      - 'outputs/phase1/**'
      - 'outputs/phase2/**'
      - 'outputs/phase3/**'
      - 'research/**'
      - '.github/workflows/site-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Astro typecheck
        working-directory: site
        run: npm run check
      - name: Production build & isolation check
        working-directory: site
        env:
          VERCEL_ENV: production
        run: |
          npm run build
          python3 - <<'PY'
          from pathlib import Path

          dist = Path('dist')
          html_routes = {path.relative_to(dist).as_posix() for path in dist.rglob('*.html')}
          assert html_routes == {'index.html', '01/index.html'}, f'unexpected public HTML: {html_routes}'
          assert (dist / 'robots.txt').is_file(), 'missing dist/robots.txt'
          for path in ('02', '03', '04', '05', '06', '07', '08', '09', '10', '11', 'work'):
              assert not (dist / path).exists(), f'private content leaked into dist/{path}'

          index = (dist / 'index.html').read_text()
          chapter = (dist / '01/index.html').read_text()
          for text in ('人类动物园', '人类灭绝', '恶意 AI', '作者私密书架', 'id="workspace"', 'class="archive-drawer"'):
              assert text not in index, f'{text!r} leaked into dist/index.html'
          assert '待 PR 审核' not in chapter, 'review marker leaked into chapter 01'
          for text in ('meta-table', 'analysis-report', 'knowledge-report', 'system-title', 'archive-label', 'noindex'):
              assert text in chapter, f'missing {text!r} in dist/01/index.html'
          PY
      - name: Author Production build check
        working-directory: site
        env:
          VERCEL_ENV: production
          AUTHOR_SITE_MODE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          python3 - <<'PY'
          import re
          from pathlib import Path

          dist = Path('dist')
          chapters = [f'{number:02}' for number in range(1, 12)]
          phase3_chapters = ('04', '05', '06', '07', '09', '10')
          core = ('story-bible', 'toc-status', 'tech-boundaries', 'guide')
          archive = [
              'phase1-02', 'phase1-03', 'phase1-08',
              'phase1-cross-review', 'phase1-titles', 'phase1-decisions',
              *(f'phase3-{chapter}' for chapter in phase3_chapters),
              'phase3-batch1-cross-review', 'phase3-batch1-decisions',
              'phase3-batch2-cross-review', 'phase3-batch2-decisions',
          ]
          retrospective = 'chapter-01-retrospective'
          if Path('../editorial/archive/01-永乐城创作复盘.md').is_file():
              archive.append(retrospective)
          else:
              assert not (dist / 'work' / retrospective).exists(), 'missing-source retrospective was emitted'
          archive.extend(('v08-continuity', 'writing-guide', 'plan', 'review-process'))
          draft_chapters = ('02', '03', '08')
          chapter_docs = [doc for chapter in draft_chapters for doc in (f'brief-{chapter}', f'phase2-{chapter}-review')]
          workspace = (*core, *archive, *chapter_docs)
          for route in (*chapters, *(f'work/{doc}' for doc in workspace)):
              assert (dist / route / 'index.html').is_file(), f'missing dist/{route}/index.html'

          index = (dist / 'index.html').read_text()
          assert '作者私密书架' in index, 'missing author label in dist/index.html'
          assert '任务书 · 未成稿' not in index and '>任务书</span>' in index, 'incorrect brief label in author index'
          before_archive, drawer, after_archive = index.partition('<details class="archive-drawer">')
          assert drawer, 'missing closed archive drawer in author index'
          archive_html, close, _ = after_archive.partition('</details>')
          assert close and f'历史与流程归档（{len(archive)} 份）' in archive_html, 'incorrect archive count'
          assert re.findall(r'href="/work/([^"]+)"', before_archive) == list(core), 'incorrect core workspace links'
          assert re.findall(r'href="/work/([^"]+)"', archive_html) == archive, 'incorrect archive links'
          for doc in chapter_docs:
              assert f'href="/work/{doc}"' not in index, f'chapter document {doc} leaked into author index'
          for previous, following in zip(chapters, chapters[1:]):
              html = (dist / previous / 'index.html').read_text()
              assert f'href="/{following}" rel="next"' in html, f'missing {previous} → {following} link'
          for chapter in draft_chapters:
              html = (dist / chapter / 'index.html').read_text()
              assert '草稿 · 审阅版' in html, f'missing draft label in dist/{chapter}/index.html'
              assert '本章底稿' in html, f'missing document navigation for chapter {chapter}'
              for doc in (f'brief-{chapter}', f'phase1-{chapter}', f'phase2-{chapter}-review'):
                  assert f'href="/work/{doc}"' in html, f'missing related link for {doc}'
                  doc_html = (dist / 'work' / doc / 'index.html').read_text()
                  assert f'href="/{chapter}">← 第 {chapter} 章</a>' in doc_html, f'missing chapter backlink for {doc}'
                  assert 'href="/">目录</a>' in doc_html, f'missing contents backlink for {doc}'
          for chapter in phase3_chapters:
              html = (dist / chapter / 'index.html').read_text()
              assert 'Gate A 结构方案已通过 · 正文待启动' in html, f'missing Gate A label for chapter {chapter}'
              doc = f'phase3-{chapter}'
              related = html.partition('<nav class="related-docs"')[2].partition('</nav>')[0]
              assert f'href="/work/{doc}">第三阶段结构方案</a>' in related, f'missing related link for {doc}'
              doc_html = (dist / 'work' / doc / 'index.html').read_text()
              assert f'href="/{chapter}">← 第 {chapter} 章</a>' in doc_html, f'missing chapter backlink for {doc}'
              assert 'href="/">目录</a>' in doc_html, f'missing contents backlink for {doc}'
          assert '<h1>无异议</h1>' in (dist / '04/index.html').read_text(), 'incorrect chapter 04 title'
          chapter_11 = (dist / '11/index.html').read_text()
          assert '写作任务书 · 正文未成稿' in chapter_11, 'missing brief label for chapter 11'
          assert '本章底稿' not in chapter_11, 'unexpected document navigation for chapter 11'
          chapter_01 = (dist / '01/index.html').read_text()
          assert '草稿 · 审阅版' not in chapter_01, 'draft label leaked into chapter 01'
          story_bible = (dist / 'work/story-bible/index.html').read_text()
          for text in ('class="doc-toc"', 'id="sec-1"', 'class="table-wrap"', 'href="/work/tech-boundaries"'):
              assert text in story_bible, f'missing {text!r} in story bible'
          PY
